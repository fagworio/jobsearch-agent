<!doctype html>
<html><body>
  <form id="application-form" class="application--form" method="get">
    <label for="first_name">First Name<span aria-hidden="true">*</span></label>
    <input id="first_name" aria-label="First Name" type="text" required>
    <label for="last_name">Last Name<span aria-hidden="true">*</span></label>
    <input id="last_name" aria-label="Last Name" type="text" required>
    <label for="email">Email<span aria-hidden="true">*</span></label>
    <input id="email" aria-label="Email" type="email" required>
    <label for="country">Country<span aria-hidden="true">*</span></label>
    <input id="country" aria-label="Country" type="text" required>
    <label for="resume">Resume/CV</label>
    <input id="resume" aria-label="Resume/CV" type="file">
  </form>
</body></html>
