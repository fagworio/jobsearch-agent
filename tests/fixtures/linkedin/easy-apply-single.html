<!doctype html>
<html><body>
<div role="dialog" aria-label="Easy Apply">
  <form id="easy-apply-form" data-linkedin="easy-apply">
    <label for="email">Email</label><input id="email" name="email" type="email" required>
    <label for="phone">Mobile phone number</label><input id="phone" name="phone" type="tel" required>
    <label for="resume">Resume</label><input id="resume" name="resume" type="file" accept=".pdf" required>
    <label for="wordpress">How many years of WordPress experience?</label>
    <input id="wordpress" name="wordpress_years" type="text" required>
    <button type="button" aria-label="Continue to next step">Next</button>
  </form>
</div>
</body></html>
