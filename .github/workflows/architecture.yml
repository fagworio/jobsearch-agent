name: Architecture

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Quatro aneis independentes. Cada job falha sozinho e a mensagem aponta a linha:
# se um contrato de fronteira quebrar, nao e preciso ler o log do outro.
jobs:
  import-linter:
    name: import-linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and architecture tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "import-linter>=2.0,<3.0"
      - name: Check the layer contracts
        run: lint-imports --no-cache

  ast-boundaries:
    name: AST boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8,<9"
      - name: Forbidden names, fields, annotations and reexports
        run: pytest -q tests/test_architecture_boundaries.py

  mypy:
    name: mypy strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "mypy>=1.11,<2.0"
      - name: Type-check the protected packages
        run: mypy

  runtime-isolation:
    name: runtime isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8,<9"
      - name: Dynamic imports and public surface
        run: pytest -q tests/test_runtime_module_isolation.py

  contract-selfcheck:
    name: contract selfcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8,<9" "import-linter>=2.0,<3.0" "mypy>=1.11,<2.0"
      # Um contrato que nunca falha nao testa nada: aqui uma violacao deliberada
      # tem de ser detectada por cada anel.
      - name: Contracts are not vacuous
        run: pytest -q tests/test_contracts_selfcheck.py
