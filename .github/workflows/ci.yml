name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pytest>=8,<9"
      - name: Run offline core tests
        run: pytest -q tests/test_persistence.py tests/test_profile_resume.py tests/test_sources_analysis.py tests/test_application_domain.py tests/test_browser_domain.py tests/test_greenhouse_adapter.py tests/test_orchestrator.py tests/test_preflight.py tests/test_hermes_assets.py
      - name: Validate CLI contract
        run: python -m jobsearch_agent.cli --help

  full-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice
      - name: Install full runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pytest>=8,<9"
      - name: Run tests
        run: pytest -q
      - name: Run PT-BR fixture smoke test
        run: |
          rm -rf data/ci-applications data/ci.db
          python -m jobsearch_agent.cli run \
            --json-file tests/fixtures/jobs/greenhouse.json \
            --db data/ci.db \
            --artifacts data/ci-applications
          test -s data/ci-applications/*/resume.txt
          test -s data/ci-applications/*/resume.docx
          test -s data/ci-applications/*/resume.pdf
          grep -R 'RESUME_READY' data/ci-applications/*/validation.json
          JOB_ID=$(python -c 'import json; print(json.load(open("data/run.json"))["job_id"])' 2>/dev/null || true)
          if [ -z "$JOB_ID" ]; then
            python -m jobsearch_agent.cli ingest --json-file tests/fixtures/jobs/greenhouse.json --db data/ci-application.db --artifacts data/ci-applications > data/ingest.json
            JOB_ID=$(python -c 'import json; print(json.load(open("data/ingest.json"))["job_id"])')
          fi
          python -m jobsearch_agent.cli application prepare "$JOB_ID" --db data/ci-application.db --artifacts data/ci-applications > data/application.json
          APP_ID=$(python -c 'import json; print(json.load(open("data/application.json"))["application"]["id"])')
          python -m jobsearch_agent.cli application status "$APP_ID" --db data/ci-application.db > data/application-status.json
          grep -q 'READY_FOR_REVIEW' data/application.json
      - name: Validate EN-US generation path
        run: |
          python -m jobsearch_agent.cli run \
            --json-file tests/fixtures/jobs/greenhouse.json \
            --language en-US \
            --db data/ci-en.db \
            --artifacts data/ci-en-applications
          test -s data/ci-en-applications/*/resume.txt
          grep -R '"language": "en-US"' data/ci-en-applications/*/resume.json

  browser-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pytest>=8,<9" playwright
          python -m playwright install --with-deps chromium
      - name: Run local Chromium dry-run fixture
        run: pytest -q tests/test_playwright_runtime.py
      - name: Run the controlled-ATS end-to-end submissions (JSA-E2E-001/002)
        run: pytest -q tests/e2e/
