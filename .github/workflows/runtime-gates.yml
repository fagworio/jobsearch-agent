name: runtime-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-runtime:
    name: core-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install . "pytest>=8,<9"
      - name: Run provider-neutral tests
        run: make test-core-runtime
      - name: Compile sources
        run: make compile

  linkedin-runtime:
    name: linkedin-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install . "pytest>=8,<9"
      - name: Run local LinkedIn fixtures only
        run: make test-linkedin-runtime

  submission-runtime:
    name: submission-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install . "pytest>=8,<9"
      - name: Run controlled local submission tests
        run: make test-submission-runtime

  browser-runtime:
    name: browser-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project, test, and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pytest>=8,<9" playwright
          python -m playwright install --with-deps chromium
      - name: Run local Playwright dry-run fixture
        run: make test-browser-runtime

  gmail-runtime:
    name: gmail-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project with the optional Gmail group
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "pytest>=8,<9" \
            "google-api-python-client>=2.100,<3.0" "google-auth-oauthlib>=1.2,<2.0"
      - name: Run the confirmation source tests
        # Sem credencial e sem rede: o que se prova aqui e least privilege,
        # portoes de permissao/escopo e a semantica "falha nao e ausencia".
        run: pytest -q tests/test_confirmation_observation.py tests/test_gmail_source.py
