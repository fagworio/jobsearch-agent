[tool.poetry]
name = "jobsearch-agent"
version = "0.1.0"
description = "Agente local para análise e preparação segura de candidaturas."
authors = ["jobsearch-agent contributors"]
readme = "README.md"
packages = [{ include = "jobsearch_agent", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
PyYAML = ">=6.0,<7.0"

[tool.poetry.group.test.dependencies]
pytest = ">=8.0,<9.0"

[tool.poetry.scripts]
jobsearch-agent = "jobsearch_agent.cli:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
