[tool.poetry]
name = "jobsearch-agent"
version = "0.1.0"
description = "Agente local para análise e preparação segura de candidaturas."
authors = ["jobsearch-agent contributors"]
readme = "README.md"
packages = [{ include = "jobsearch_agent", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
PyYAML = ">=6.0,<7.0"
pydantic = ">=2.7,<3.0"
pydantic-settings = ">=2.2,<3.0"
httpx = ">=0.27,<1.0"
beautifulsoup4 = ">=4.12,<5.0"
lingua-language-detector = ">=2.0,<3.0"
rapidfuzz = ">=3.9,<4.0"
python-docx = ">=1.1,<2.0"
pypdf = ">=5.0,<7.0"

[tool.poetry.group.test.dependencies]
pytest = ">=8.0,<9.0"

[tool.poetry.group.discovery.dependencies]
python-jobspy = ">=1.1,<2.0"

[tool.poetry.group.browser.dependencies]
playwright = ">=1.45,<2.0"

[tool.poetry.scripts]
jobsearch-agent = "jobsearch_agent.cli:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
