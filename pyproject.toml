[tool.poetry]
name = "jobsearch-agent"
version = "0.1.0"
description = "Agente local para análise e preparação segura de candidaturas."
authors = ["jobsearch-agent contributors"]
readme = "README.md"
packages = [
    { include = "jobsearch_agent", from = "src" },
    # Fase 0 do challenge_resolution: pacote proprio, com a fronteira verificada
    # por import-linter. Dependencia de mao unica: o agente pode importa-lo; ele
    # nao importa nada do agente.
    { include = "challenge_resolution", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
PyYAML = ">=6.0,<7.0"
pydantic = ">=2.7,<3.0"
pydantic-settings = ">=2.2,<3.0"
httpx = ">=0.27,<1.0"
beautifulsoup4 = ">=4.12,<5.0"
lingua-language-detector = ">=2.0,<3.0"
rapidfuzz = ">=3.9,<4.0"
python-docx = ">=1.1,<2.0"
pypdf = ">=5.0,<7.0"
# JSA-CG-020: artefato publicado, fixado por SHA IMUTAVEL do release v0.1.0.
# Nao usar branch: um branch tornaria o build nao reproduzivel. O SHA tambem
# protege contra tag movida no remoto, que uma tag sozinha nao impede.
challenge-guard = { git = "https://github.com/fagworio/challenge-guard.git", rev = "e5fd527bf58137a27b74e93cd45ac22ebfe4a087" }

[tool.poetry.group.test.dependencies]
pytest = ">=8.0,<9.0"
# Contratos da Fase 0 do challenge_resolution: tipagem estrita e fronteira de
# import como check estatico (o mesmo invariante do teste de arquitetura).
mypy = ">=1.11,<2.0"
import-linter = ">=2.0,<3.0"

[tool.poetry.group.discovery.dependencies]
python-jobspy = ">=1.1,<2.0"

[tool.poetry.group.browser.dependencies]
playwright = ">=1.48,<2.0"

# JSA-CONF-006: leitura da caixa de e-mail para confirmacao observavel. Grupo
# OPCIONAL de proposito: o nucleo, o handoff e os testes rodam sem credencial,
# sem rede e sem cliente do Google instalado. O escopo usado e somente
# gmail.readonly; ver docs/adr/0006-observable-confirmation.md.
[tool.poetry.group.gmail.dependencies]
google-api-python-client = ">=2.100,<3.0"
google-auth-oauthlib = ">=1.2,<2.0"

[tool.poetry.scripts]
jobsearch-agent = "jobsearch_agent.cli:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "requires_libreoffice: test requires LibreOffice for PDF resume conversion",
    "integration: integracao entre o ApplicationLoop e o challenge-guard (Chromium real)",
]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
# O pacote de resolucao e novo e pequeno: ele nasce sob `strict`. O resto do
# projeto nao esta sob strict e endurecer tudo de uma vez esconderia regressao
# de tipagem no que ja existe, entao o rigor entra por pacote.
files = [
    "src/challenge_resolution",
    "src/jobsearch_agent/live_view.py",
    "src/jobsearch_agent/challenge_gate.py",
]
strict = true
warn_unreachable = true
warn_unused_ignores = true
no_implicit_reexport = true
no_implicit_optional = true
# `Any` explicito nao entra no pacote protegido: um saco de valores opacos usa
# `object`. (Nos modulos do agente que recebem a `page`, `Any` continua correto:
# tipar como Playwright acoplaria a fronteira a biblioteca.)
disallow_any_explicit = true
disallow_any_generics = true
disallow_subclassing_any = true

[[tool.mypy.overrides]]
module = "challenge_guard.*"
ignore_missing_imports = true

# Os dois modulos do agente que falam com o browser recebem a `page` como tipo
# opaco: tipar como Playwright acoplaria a fronteira a biblioteca. `strict`
# continua valendo; so a proibicao de `Any` explicito nao se aplica.
[[tool.mypy.overrides]]
module = ["jobsearch_agent.live_view", "jobsearch_agent.challenge_gate"]
strict = true
disallow_any_explicit = false

[tool.importlinter]
# `root_packages` (plural) com os pacotes REAIS. Um `root_package` simbolico
# que nao existe derruba a ferramenta ("Could not find package ...").
root_packages = ["challenge_resolution", "jobsearch_agent"]
# `challenge_guard` e dependencia instalada (SHA imutavel), nao pacote do repo:
# sem isto os contratos que o citam nao resolvem.
include_external_packages = true

# Contrato 1: as camadas empilham. O topo importa o de baixo; o de baixo nunca
# importa o de cima. `challenge_guard` e o fundo (percepcao pura).
[[tool.importlinter.contracts]]
name = "arquitetura em camadas"
type = "layers"
layers = [
    "jobsearch_agent",
    "challenge_resolution",
    "challenge_guard",
]

# Contrato 2: o pacote de resolucao nao conhece o agente.
[[tool.importlinter.contracts]]
name = "challenge_resolution nao importa jobsearch_agent"
type = "forbidden"
source_modules = ["challenge_resolution"]
forbidden_modules = ["jobsearch_agent"]

# Contrato 3: a fronteira de escrita e inalcancavel a partir da resolucao.
[[tool.importlinter.contracts]]
name = "challenge_resolution nao alcanca a fronteira de escrita"
type = "forbidden"
source_modules = ["challenge_resolution"]
forbidden_modules = [
    "jobsearch_agent.browser",
    "jobsearch_agent.submission",
    "jobsearch_agent.submission_browser",
]

# Contrato 4: o relay do operador e o handoff sao EXECUCAO, nao decisao.
# A decisao de resolver mora no pacote de resolucao; se a execucao passar a
# importa-la, as duas camadas viram uma so e a fronteira deixa de valer.
[[tool.importlinter.contracts]]
name = "execucao (relay e handoff) nao depende do motor de resolucao"
type = "forbidden"
source_modules = [
    "jobsearch_agent.live_view",
    "jobsearch_agent.handoff",
]
forbidden_modules = ["challenge_resolution"]

# Contrato 5: o handoff assincrono (pacote -> envio manual -> confirmacao) nao
# toca browser. Ele produz material para uma PESSOA, em outro navegador.
[[tool.importlinter.contracts]]
name = "o handoff assincrono nao toca browser"
type = "forbidden"
source_modules = ["jobsearch_agent.handoff"]
forbidden_modules = ["jobsearch_agent.browser", "playwright"]
# Direto, nao transitivo: o handoff importa `challenges` para reconstruir a
# proveniencia do desafio a partir do conjunto fechado do guard, e `challenges`
# importa o browser. O que se proibe e o handoff FALAR com o browser — nao
# herdar essa dependencia por tabela.
allow_indirect_imports = true
